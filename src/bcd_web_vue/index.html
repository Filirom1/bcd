<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="/static/vendor/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons 1.11.3 -->
    <link rel="stylesheet" href="/static/vendor/css/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/loading.css">
    <link rel="stylesheet" href="/static/css/print-labels.css">

</head>
<body>
    <div id="app">
        <!-- Beautiful Loading Screen -->
        <div class="bcd-loading">
            <!-- Loading Content -->
            <div class="bcd-loading-content">
                <!-- Animated Book Icon -->
                <div class="bcd-logo-container">
                    <i class="bi bi-book bcd-book-icon"></i>
                </div>

                <!-- App Title (injected server-side from library_code) -->
                <h1 class="bcd-title"></h1>
                <p class="bcd-subtitle">Bibliothèque que Claude a Développée</p>

                <!-- Progress Bar -->
                <div class="bcd-loader">
                    <div class="bcd-loader-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vue 3.4.21 (Global Build) -->
    <script src="/static/vendor/js/vue.global.js"></script>

    <!-- Vue Router 4.2.5 (Global Build) -->
    <script src="/static/vendor/js/vue-router.global.js"></script>

    <!-- Vue I18n 9.9.1 (Global Build) -->
    <script src="/static/vendor/js/vue-i18n.global.js"></script>

    <!-- Bootstrap 5.3.3 JS Bundle (includes Popper) -->
    <script src="/static/vendor/js/bootstrap.bundle.min.js"></script>

    <!-- marked.js v9 for markdown rendering in help panels -->
    <script src="/static/vendor/js/marked.min.js"></script>

    <!-- JsBarcode for client-side barcode generation -->
    <script src="/static/vendor/js/JsBarcode.all.min.js"></script>

    <!-- Application Scripts -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
