name: Build Kids Client

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'bcd_kids/**'
      - '.github/workflows/build-godot.yml'
  workflow_dispatch:
    inputs:
      use_official_templates:
        description: 'Use official Godot templates (skip custom build) — for debugging'
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.6.1"
  GODOT_SOURCE_TAG: "4.6.1-stable"

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 0 : Vérifie si ce source tree a déjà été buildé
  # Résultat : should-build=true/false transmis aux jobs suivants
  # ═══════════════════════════════════════════════════════════════════════════
  check:
    name: Check Build Cache
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.set-flag.outputs.should-build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look up build marker
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .build-marker
          key: bcd-kids-built-${{ hashFiles('bcd_kids/**') }}
          lookup-only: true

      - name: Set should-build flag
        id: set-flag
        run: |
          if [ "${{ steps.marker.outputs.cache-hit }}" = "true" ]; then
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "Build already exists for this source tree — nothing to do."
          else
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "No existing build found — will build."
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 : Compilation des templates custom (seulement si custom.py change)
  # Durée : ~90 min la première fois, instantané ensuite (cache)
  # ═══════════════════════════════════════════════════════════════════════════
  compile-templates:
    name: Restore Godot Templates
    needs: check
    if: needs.check.outputs.should-build == 'true' && inputs.use_official_templates != true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute cache key
        id: cache-key
        run: |
          echo "key=godot-templates-${{ env.GODOT_VERSION }}-${{ hashFiles('bcd_kids/custom.py') }}" \
            >> $GITHUB_OUTPUT

      - name: Restore templates from cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: custom-templates/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fail if templates not cached
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "ERROR: Godot templates not found in cache."
          echo "Run 'Compile Godot Templates' workflow manually first:"
          echo "  Actions → Compile Godot Templates → Run workflow"
          exit 1

      - name: Upload templates artifact (pour les jobs Docker)
        uses: actions/upload-artifact@v4
        with:
          name: godot-custom-templates
          path: custom-templates/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 : Export Windows
  # ═══════════════════════════════════════════════════════════════════════════
  export-windows:
    name: Windows Export
    needs: [check, compile-templates]
    if: always() && needs.check.outputs.should-build == 'true' && (needs.compile-templates.result == 'success' || needs.compile-templates.result == 'skipped')
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.1   # ← corrigé (était 4.3)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download custom templates
        if: inputs.use_official_templates != true
        uses: actions/download-artifact@v4
        with:
          name: godot-custom-templates
          path: custom-templates/

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          if [ "${{ inputs.use_official_templates }}" != "true" ]; then
            echo "Using custom templates"
            cp custom-templates/windows_release_x86_64.exe \
               ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/windows_release_x86_64.exe
          else
            echo "Using official templates only (debug mode)"
          fi

      - name: Import resources
        run: godot --headless --import --path bcd_kids/ || true

      - name: Windows Build
        run: |
          cd bcd_kids
          mkdir -p builds/windows
          godot --headless --verbose --export-release "Windows Desktop" \
                builds/windows/BCD-Kids.exe

      - name: Upload Windows artifact (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BCD-Kids-Windows-${{ inputs.use_official_templates == true && 'official' || 'custom' }}-templates
          path: bcd_kids/builds/windows/
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 : Export Linux
  # ═══════════════════════════════════════════════════════════════════════════
  export-linux:
    name: Linux Export
    needs: [check, compile-templates]
    if: always() && needs.check.outputs.should-build == 'true' && (needs.compile-templates.result == 'success' || needs.compile-templates.result == 'skipped')
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.1   # ← corrigé (était 4.3)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download custom templates
        if: inputs.use_official_templates != true
        uses: actions/download-artifact@v4
        with:
          name: godot-custom-templates
          path: custom-templates/

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          if [ "${{ inputs.use_official_templates }}" != "true" ]; then
            echo "Using custom templates"
            cp custom-templates/linux_release.x86_64 \
               ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/linux_release.x86_64
          else
            echo "Using official templates only (debug mode)"
          fi

      - name: Import resources
        run: godot --headless --import --path bcd_kids/ || true

      - name: Linux Build
        run: |
          cd bcd_kids
          mkdir -p builds/linux
          godot --headless --verbose --export-release "Linux/X11" \
                builds/linux/BCD-Kids.x86_64

      - name: Upload Linux artifact (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BCD-Kids-Linux-${{ inputs.use_official_templates == true && 'official' || 'custom' }}-templates
          path: bcd_kids/builds/linux/
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 : Résumé
  # ═══════════════════════════════════════════════════════════════════════════
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [check, export-windows, export-linux]
    if: always()
    steps:
      - name: Checkout (for marker save)
        if: needs.check.outputs.should-build == 'true' && needs.export-windows.result == 'success' && needs.export-linux.result == 'success'
        uses: actions/checkout@v4

      - name: Save build marker to cache
        if: needs.check.outputs.should-build == 'true' && needs.export-windows.result == 'success' && needs.export-linux.result == 'success'
        run: touch .build-marker

      - name: Store build marker
        if: needs.check.outputs.should-build == 'true' && needs.export-windows.result == 'success' && needs.export-linux.result == 'success'
        uses: actions/cache/save@v4
        with:
          path: .build-marker
          key: bcd-kids-built-${{ hashFiles('bcd_kids/**') }}

      - name: Check build results
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.check.outputs.should-build }}" = "false" ]; then
            echo "⏭️ Already built for this source tree — skipped." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "- Windows: ${{ needs.export-windows.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: ${{ needs.export-linux.result }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.export-windows.result }}" = "success" ] && \
             [ "${{ needs.export-linux.result }}" = "success" ]; then
            echo "✅ All builds passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some builds failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi