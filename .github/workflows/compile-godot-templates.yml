name: Compile Godot Templates

# Lancer MANUELLEMENT après avoir modifié bcd_kids/custom.py
# Actions → "Compile Godot Templates" → Run workflow
# Durée : ~90 min. À faire une seule fois par version de Godot ou de custom.py.
on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.1"
  GODOT_SOURCE_TAG: "4.6.1-stable"

jobs:
  compile:
    name: Compile Custom Templates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compute cache key
        id: cache-key
        run: |
          echo "key=godot-templates-${{ env.GODOT_VERSION }}-${{ hashFiles('bcd_kids/custom.py') }}" \
            >> $GITHUB_OUTPUT

      - name: Check if templates already cached
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: custom-templates/
          key: ${{ steps.cache-key.outputs.key }}
          lookup-only: true

      - name: Already cached — nothing to do
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "Templates already in cache for key: ${{ steps.cache-key.outputs.key }}"
          echo "Nothing to compile."

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential scons python3 \
            pkg-config libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu-dev libudev-dev libxi-dev libxrandr-dev \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Clone Godot ${{ env.GODOT_SOURCE_TAG }} source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 \
            --branch ${{ env.GODOT_SOURCE_TAG }} \
            https://github.com/godotengine/godot.git godot-src

      - name: Compile Windows template (MinGW)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cp bcd_kids/custom.py godot-src/custom.py
          cd godot-src
          scons platform=windows arch=x86_64 use_mingw=yes d3d12=no profile=custom.py

      - name: Compile Linux template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd godot-src
          scons platform=linuxbsd arch=x86_64 d3d12=no profile=custom.py

      - name: Collect compiled templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p custom-templates
          cp godot-src/bin/godot.linuxbsd.template_release.x86_64 \
             custom-templates/linux_release.x86_64
          cp godot-src/bin/godot.windows.template_release.x86_64.exe \
             custom-templates/windows_release_x86_64.exe

      - name: Save templates to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: custom-templates/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Done
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "Templates compiled and cached under key ${{ steps.cache-key.outputs.key }}"
