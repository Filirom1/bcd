name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.1"
  GODOT_SOURCE_TAG: "4.6.1-stable"

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 : Tests
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run JS tests
        run: npm run test:js
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install Playwright Chromium
        run: playwright install chromium
      - name: Initialize database
        run: alembic upgrade head
      - name: Build Web UI
        run: npm run build:web
      - name: Run complete Python test suite
        run: pytest tests -v
      - name: Run Web UI Production E2E tests
        env:
          WEB_ASSETS_MODE: build
        run: npm run test:web-production

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1b : Build Web UI Artifact
  # ═══════════════════════════════════════════════════════════════════════════
  build-web:
    name: Build Web UI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build Web UI and Verify
        run: |
          npm run build:web
          npm run verify:web-build
      - name: Upload Web UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-build
          path: build/web/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 : Build BCD serveur — Windows (PyInstaller, cross-compile impossible,
  #          doit tourner sur windows-latest)
  # ═══════════════════════════════════════════════════════════════════════════
  build-bcd-windows:
    name: Build BCD (Windows)
    needs: [test, build-web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Web UI build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-ui-build
          path: build/web/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -e "." pyinstaller

      - name: Download UPX
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.2/upx-4.2.2-win64.zip" -OutFile "upx.zip"
          Expand-Archive -Path upx.zip -DestinationPath .
          Move-Item -Path upx-4.2.2-win64 -Destination upx

      - name: Build with PyInstaller
        run: pyinstaller --clean --upx-dir=upx bcd.spec

      - name: Upload BCD Windows files
        uses: actions/upload-artifact@v4
        with:
          name: bcd-windows-files
          path: dist/bcd/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 : Build BCD serveur — Linux (PyInstaller)
  # ═══════════════════════════════════════════════════════════════════════════
  build-bcd-linux:
    name: Build BCD (Linux)
    needs: [test, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Web UI build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-ui-build
          path: build/web/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            upx-ucl \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-dev

      - name: Install Python dependencies
        run: pip install -e "." pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean bcd.spec

      - name: Upload BCD Linux files
        uses: actions/upload-artifact@v4
        with:
          name: bcd-linux-files
          path: dist/bcd/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 : Récupère les templates Godot depuis le cache
  # PRÉ-REQUIS : avoir lancé manuellement "Compile Godot Templates" au moins
  #              une fois depuis Actions → compile-godot-templates.yml
  # ═══════════════════════════════════════════════════════════════════════════
  compile-templates:
    name: Restore Godot Templates
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute cache key
        id: cache-key
        run: |
          echo "key=godot-templates-${{ env.GODOT_VERSION }}-${{ hashFiles('bcd_kids/custom.py') }}" \
            >> $GITHUB_OUTPUT

      - name: Restore templates from cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: custom-templates/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fail if templates not cached
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "ERROR: Godot templates not found in cache."
          echo "Run 'Compile Godot Templates' workflow manually first:"
          echo "  Actions → Compile Godot Templates → Run workflow"
          exit 1

      - name: Upload templates artifact (pour les jobs Docker)
        uses: actions/upload-artifact@v4
        with:
          name: godot-custom-templates
          path: custom-templates/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5 : Export BCD Kids — Windows (Godot)
  # ═══════════════════════════════════════════════════════════════════════════
  build-kids-windows:
    name: Build BCD Kids (Windows)
    needs: compile-templates
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download custom templates
        uses: actions/download-artifact@v4
        with:
          name: godot-custom-templates
          path: custom-templates/

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          cp custom-templates/windows_release_x86_64.exe \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/windows_release_x86_64.exe

      - name: Import resources
        run: godot --headless --import --path bcd_kids/ || true

      - name: Export Windows
        run: |
          cd bcd_kids
          mkdir -p builds/windows
          godot --headless --verbose --export-release "Windows Desktop" \
                builds/windows/BCD-Kids.exe

      - name: Upload BCD Kids Windows files
        uses: actions/upload-artifact@v4
        with:
          name: bcd-kids-windows-files
          path: bcd_kids/builds/windows/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 6 : Export BCD Kids — Linux (Godot)
  # ═══════════════════════════════════════════════════════════════════════════
  build-kids-linux:
    name: Build BCD Kids (Linux)
    needs: compile-templates
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download custom templates
        uses: actions/download-artifact@v4
        with:
          name: godot-custom-templates
          path: custom-templates/

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          cp custom-templates/linux_release.x86_64 \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/linux_release.x86_64

      - name: Import resources
        run: godot --headless --import --path bcd_kids/ || true

      - name: Export Linux
        run: |
          cd bcd_kids
          mkdir -p builds/linux
          godot --headless --verbose --export-release "Linux/X11" \
                builds/linux/BCD-Kids.x86_64

      - name: Upload BCD Kids Linux files
        uses: actions/upload-artifact@v4
        with:
          name: bcd-kids-linux-files
          path: bcd_kids/builds/linux/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 7 : Assemblage des archives + GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    needs: [build-bcd-windows, build-bcd-linux, build-kids-windows, build-kids-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # ── Windows ZIP ────────────────────────────────────────────────────────
      - name: Assemble Windows package
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          PKG="BCD-v${VERSION}-Windows"
          mkdir -p "$PKG"

          # BCD serveur (PyInstaller)
          cp -r artifacts/bcd-windows-files/. "$PKG/"

          # BCD Kids client (Godot)
          cp artifacts/bcd-kids-windows-files/BCD-Kids.exe "$PKG/"
          cp artifacts/bcd-kids-windows-files/BCD-Kids.pck "$PKG/"

          # Documentation
          cp README.md README_FR.md INSTALL.md LICENSE "$PKG/"

          printf "BCD Library Management System\nVersion: %s\nPlatform: Windows 10/11 (64-bit)\n" \
            "$VERSION" > "$PKG/VERSION.txt"

          zip -r "${PKG}.zip" "$PKG"
          sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"

      # ── Linux tar.gz ───────────────────────────────────────────────────────
      - name: Assemble Linux package
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          PKG="BCD-v${VERSION}-Linux"
          mkdir -p "$PKG"

          # BCD serveur (PyInstaller)
          cp -r artifacts/bcd-linux-files/. "$PKG/"
          chmod +x "$PKG/bcd"

          # BCD Kids client (Godot)
          cp artifacts/bcd-kids-linux-files/BCD-Kids.x86_64 "$PKG/"
          cp artifacts/bcd-kids-linux-files/BCD-Kids.pck "$PKG/"
          chmod +x "$PKG/BCD-Kids.x86_64"

          # Documentation
          cp README.md README_FR.md INSTALL.md LICENSE "$PKG/"

          printf "BCD Library Management System\nVersion: %s\nPlatform: Linux x86_64\n" \
            "$VERSION" > "$PKG/VERSION.txt"

          tar -czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      # ── Extract Release Notes from CHANGELOG.md ─────────────────────────────
      - name: Extract Release Notes
        id: release_notes
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          # Find version header block in CHANGELOG.md and extract everything up to next ## header
          sed -n "/## \[$VERSION\]/,/## /p" CHANGELOG.md | sed '$d' > release_notes.md
          # If empty or not found, fallback to header
          if [ ! -s release_notes.md ]; then
            echo "## [$VERSION]" > release_notes.md
          fi

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: BCD v${{ steps.get_version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            BCD-v${{ steps.get_version.outputs.VERSION }}-Windows.zip
            BCD-v${{ steps.get_version.outputs.VERSION }}-Windows.zip.sha256
            BCD-v${{ steps.get_version.outputs.VERSION }}-Linux.tar.gz
            BCD-v${{ steps.get_version.outputs.VERSION }}-Linux.tar.gz.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
