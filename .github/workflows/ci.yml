name: CI - Tests & Coverage

on:
  push:
    branches: ['**']  # Run on all branches
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Web UI
        run: npm run build:web

      - name: Verify Web UI Build
        run: npm run verify:web-build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium
        run: |
          playwright install chromium

      - name: Initialize database
        run: |
          alembic upgrade head

      - name: Run Python test suites with coverage
        run: |
          set -o pipefail
          python run_tests.py python --cov -v | tee pytest.log

      - name: Run Web UI Production E2E tests
        env:
          WEB_ASSETS_MODE: build
        run: |
          npm run test:web-production

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: |
            pytest.log
            htmlcov/
            coverage.xml
          if-no-files-found: ignore

      - name: Generate coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report --skip-empty >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check coverage threshold
        run: coverage report --fail-under=80

#      - name: Upload coverage to Codecov (optional)
#        uses: codecov/codecov-action@v4
#        with:
#          file: ./coverage.xml
#          flags: unittests
#          name: codecov-umbrella
#          fail_ci_if_error: false
#        env:
#          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
#        continue-on-error: true

  javascript-tests:
    name: Test (JavaScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Run JavaScript static type checking
        run: npm run type-check

      - name: Run JavaScript tests with coverage
        run: npm run test:js:coverage

      - name: Generate JavaScript coverage summary
        if: always()
        run: |
          if [ ! -f coverage-js/coverage-summary.json ]; then
            exit 0
          fi
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const summary = require('./coverage-js/coverage-summary.json').total;
          console.log('## JavaScript Coverage Report');
          console.log('');
          console.log(`- Statements: ${summary.statements.pct}% (${summary.statements.covered}/${summary.statements.total})`);
          console.log(`- Branches: ${summary.branches.pct}% (${summary.branches.covered}/${summary.branches.total})`);
          console.log(`- Functions: ${summary.functions.pct}% (${summary.functions.covered}/${summary.functions.total})`);
          console.log(`- Lines: ${summary.lines.pct}% (${summary.lines.covered}/${summary.lines.total})`);
          NODE

      - name: Upload JavaScript coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-coverage-report
          path: coverage-js/
          if-no-files-found: ignore

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, javascript-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.javascript-tests.result }}" = "success" ]; then
            echo "✅ Python and JavaScript tests passed!"
            exit 0
          else
            echo "❌ Tests failed"
            exit 1
          fi
