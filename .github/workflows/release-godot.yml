name: Release Kids Client

# Triggered by tags created with: python scripts/bump_version.py patch --push
# Remplacé par release.yml — conservé pour référence uniquement
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.6.1"
  GODOT_SOURCE_TAG: "4.6.1-stable"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 : Compilation des templates custom (seulement si custom.py change)
  # ═══════════════════════════════════════════════════════════════════════════
  compile-templates:
    name: Compile Custom Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute cache key
        id: cache-key
        run: |
          echo "key=godot-templates-${{ env.GODOT_VERSION }}-${{ hashFiles('bcd_kids/custom.py') }}" \
            >> $GITHUB_OUTPUT

      - name: Restore templates from cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: custom-templates/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential scons python3 \
            pkg-config libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu-dev libudev-dev libxi-dev libxrandr-dev \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          # Configure MinGW to use POSIX threads (required by Godot)
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Clone Godot ${{ env.GODOT_SOURCE_TAG }} source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 \
            --branch ${{ env.GODOT_SOURCE_TAG }} \
            https://github.com/godotengine/godot.git godot-src

      - name: Copy custom.py into Godot source
        if: steps.cache.outputs.cache-hit != 'true'
        run: cp bcd_kids/custom.py godot-src/custom.py

      - name: Compile Windows template (cross-compile via MinGW)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd godot-src
          scons platform=windows arch=x86_64 use_mingw=yes d3d12=no profile=custom.py

      - name: Compile Linux template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd godot-src
          scons platform=linuxbsd arch=x86_64 d3d12=no profile=custom.py

      - name: Collect compiled templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p custom-templates
          cp godot-src/bin/godot.linuxbsd.template_release.x86_64 \
             custom-templates/linux_release.x86_64
          cp godot-src/bin/godot.windows.template_release.x86_64.exe \
             custom-templates/windows_release_x86_64.exe

      - name: Save templates to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: custom-templates/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Upload templates as artifact (for Docker jobs)
        uses: actions/upload-artifact@v4
        with:
          name: godot-custom-templates
          path: custom-templates/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 : Export Windows
  # ═══════════════════════════════════════════════════════════════════════════
  export-windows:
    name: Windows Export
    needs: compile-templates
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download custom templates artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-custom-templates
          path: custom-templates/

      - name: Setup export templates (officiel + remplacement custom)
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          # On remplace uniquement le binaire template par notre version optimisée
          cp custom-templates/windows_release_x86_64.exe \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/windows_release_x86_64.exe

      - name: Windows Build
        run: |
          cd bcd_kids
          mkdir -v -p builds/windows
          godot --headless --verbose --export-release "Windows Desktop" builds/windows/BCD-Kids.exe

      - name: Extract version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create Windows ZIP
        run: |
          cd bcd_kids/builds/windows
          zip -r BCD-Kids-v${{ steps.get_version.outputs.VERSION }}-Windows.zip .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: bcd_kids/builds/windows/BCD-Kids-v${{ steps.get_version.outputs.VERSION }}-Windows.zip
          retention-days: 90

  export-linux:
    name: Linux Export
    needs: compile-templates
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download custom templates artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-custom-templates
          path: custom-templates/

      - name: Setup export templates (officiel + remplacement custom)
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          # On remplace uniquement le binaire template par notre version optimisée
          cp custom-templates/linux_release.x86_64 \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/linux_release.x86_64

      - name: Linux Build
        run: |
          cd bcd_kids
          mkdir -v -p builds/linux
          godot --headless --verbose --export-release "Linux/X11" builds/linux/BCD-Kids.x86_64

      - name: Extract version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Linux tar.gz
        run: |
          cd bcd_kids/builds/linux
          tar -czf BCD-Kids-v${{ steps.get_version.outputs.VERSION }}-Linux.tar.gz *

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: bcd_kids/builds/linux/BCD-Kids-v${{ steps.get_version.outputs.VERSION }}-Linux.tar.gz
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [export-windows, export-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} \; > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: BCD Kids v${{ steps.get_version.outputs.VERSION }}
          body: |
            # BCD Kids v${{ steps.get_version.outputs.VERSION }}

            Client BCD Kids pour BCD (Bibliothèque Centre Documentaire)

            ## 📦 Téléchargements

            - **Windows**: `BCD-Kids-v${{ steps.get_version.outputs.VERSION }}-Windows.zip`
            - **Linux**: `BCD-Kids-v${{ steps.get_version.outputs.VERSION }}-Linux.tar.gz`

            ## 🚀 Installation

            ### Windows
            1. Télécharger le ZIP Windows
            2. Extraire dans un dossier
            3. Lancer `BCD-Kids.exe`

            ### Linux
            1. Télécharger le tar.gz Linux
            2. Extraire: `tar -xzf BCD-Kids-v${{ steps.get_version.outputs.VERSION }}-Linux.tar.gz`
            3. Rendre exécutable: `chmod +x BCD-Kids.x86_64`
            4. Lancer: `./BCD-Kids.x86_64`

            ## 🎯 Fonctionnalités

            - ✅ Découverte automatique du serveur (mDNS)
            - ✅ Emprunter des livres (scan code-barres)
            - ✅ Retourner des livres
            - ✅ Rechercher dans le catalogue (avec filtres)
            - ✅ Gérer les réservations
            - ✅ Interface enfants CP-CM2
            - ✅ Bilingue FR/EN
            - 🎨 Design coloré et kid-friendly

            ## 📋 Prérequis

            Le serveur BCD API doit être lancé sur le réseau local.

            ## 🔐 Vérification

            Vérifier l'intégrité avec les checksums SHA256 dans `checksums.txt`.

            ## 📝 Notes de version

            Voir les commits depuis la dernière version pour les détails.

            ---

            **Build**: GitHub Actions
            **Commit**: ${{ github.sha }}
            **Date**: ${{ github.event.head_commit.timestamp }}
          files: |
            artifacts/windows-build/BCD-Kids-v${{ steps.get_version.outputs.VERSION }}-Windows.zip
            artifacts/linux-build/BCD-Kids-v${{ steps.get_version.outputs.VERSION }}-Linux.tar.gz
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
