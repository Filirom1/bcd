[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcd"
version = "0.13.0"
description = "School library management system (Bibliothèque que Claude a Développée)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "BCD Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Server (API + Web UI)
    "fastapi[all]>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.6.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "lxml>=5.3.0",
    "zeroconf>=0.131.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "httpx>=0.28.1",
]
converters = [
    "xlrd",
]
dev = [
    "bcd[cli]",
    "bcd[converters]",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-playwright>=0.7.2",
    "playwright>=1.50.0",
    "black>=23.12.1",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "ipython>=8.19.0",
]

[project.urls]
Repository = "https://github.com/Filirom1/bcd"
Issues = "https://github.com/Filirom1/bcd/issues"

[project.scripts]
bcd = "bcd_api.main:main"
bcd-cli = "bcd_cli.main:cli"

[tool.setuptools]
packages = ["bcd_api", "bcd_cli", "bcd_converters", "shared"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore::DeprecationWarning",
    "ignore:.*httpx.*starlette.testclient.*",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests (external APIs)",
    "slow: Slow running tests",
    "e2e: End-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
target-version = "py311"

[tool.bcd]
github_repo = "Filirom1/bcd"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "venv",
    "build",
    "dist"
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportGeneralTypeIssues = "none"
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportArgumentType = "none"
reportReturnType = "none"
reportCallIssue = "none"
reportOperatorIssue = "none"
